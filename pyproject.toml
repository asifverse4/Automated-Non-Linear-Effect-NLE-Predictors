[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nle-predictor"
version = "1.0.0"
description = "Automated Non-Linear Effect (NLE) Predictors and Thermodynamic Intelligence for Asymmetric Catalysis"
readme = "README.md"
authors = [
    { name = "Asif Raza", email = "asifraza@example.com" }
]
license = { text = "MIT" }
keywords = [
    "asymmetric-catalysis",
    "computational-chemistry",
    "non-linear-effects",
    "kagan-model",
    "dft",
    "crest",
    "orca",
    "enantioselectivity",
    "thermodynamics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]
all = [
    "nle-predictor[dev]"
]

[project.urls]
Homepage = "https://github.com/asifverse4/Automated-Non-Linear-Effect-NLE-Predictors"
Repository = "https://github.com/asifverse4/Automated-Non-Linear-Effect-NLE-Predictors.git"
"Bug Tracker" = "https://github.com/asifverse4/Automated-Non-Linear-Effect-NLE-Predictors/issues"

[project.scripts]
nle-predictor = "nle_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nle_predictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
