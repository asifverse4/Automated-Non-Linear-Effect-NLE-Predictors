name: Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Standalone Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Compile standalone executable with PyInstaller
        run: |
          pyinstaller --clean nle_predictor.spec

      - name: Compress Windows executable distribution
        run: |
          Compress-Archive -Path dist/nle-predictor -DestinationPath nle-predictor-windows-x64.zip -Force

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: nle-predictor-windows-x64.zip

  build-and-release:
    name: Build Distribution & Publish GitHub Release
    needs: build-windows-exe
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Python wheel and source distribution
        run: |
          python -m build

      - name: Download Windows executable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist

      - name: Package academic manuscript submission bundle
        run: |
          python -c "import zipfile, os; z = zipfile.ZipFile('manuscript/submission_bundle.zip', 'w', zipfile.ZIP_DEFLATED); [z.write(os.path.join(r, f), os.path.relpath(os.path.join(r, f), 'manuscript')) for r, _, fs in os.walk('manuscript') for f in fs if not f.endswith('.zip')]; print('Created manuscript/submission_bundle.zip')"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/nle-predictor-windows-x64.zip
            manuscript/submission_bundle.zip
          generate_release_notes: true
          draft: false
          prerelease: false
