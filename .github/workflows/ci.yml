name: CI / Quality & Cross-Platform Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          python -m ruff check .

      - name: Run test suite with pytest
        run: |
          python -m pytest -v

      - name: Verify CLI subcommands
        run: |
          nle-predictor simulate --delta-g -1.8 --outdir test_sim_ci
          nle-predictor run --mock --outdir test_mock_ci --sensitivity
          nle-predictor fit --data examples/benchmarks/datasets/kagan_amplification.csv --outdir test_fit_ci
          nle-predictor diagnostics --data examples/benchmarks/datasets/kagan_amplification.csv
